12;--caution-200:#6b5416;--caution-500:#fbbf24;--caution-800:#fcd34d;--caution-900:#fde68a;--coral-200:#6b2434;--emerald-200:#1f5c4a;}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:var(--font-size-base)/var(--font-line-base) var(--font-family)}
.classic-header{background:var(--insights-header);border-bottom:1px solid var(--line)}
.bar{max-width:var(--space-container);margin:0 auto;padding:var(--space-md) 20px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-md)}
.brand{font-weight:var(--font-weight-strong);letter-spacing:.02em}
.classic-header nav ol{list-style:none;margin:0;padding:0;display:flex;gap:var(--space-xs)}
.classic-header nav button{background:none;border:0;color:var(--slate-600);font:inherit;padding:var(--space-xs) var(--space-md);border-radius:var(--space-radius-pill);cursor:pointer}
.classic-header nav button[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.classic-header nav button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:var(--space-container);margin:0 auto;padding:var(--space-xl) 20px 64px;transition:margin-right .15s}
body.drawer-open main{margin-right:var(--space-drawer)}
@media (max-width:900px){body.drawer-open main{margin-right:0}}
h1{font-size:var(--font-size-h1);margin:0 0 var(--space-xs)}h2{font-size:var(--font-size-h2);margin:var(--space-xl) 0 var(--space-sm)}
h3{font-size:var(--font-scale-card);margin:var(--space-lg) 0 var(--space-xs);font-weight:700}
.muted{color:var(--muted)}a{color:var(--accent)}
.cards{display:grid;gap:var(--space-md);margin-top:var(--space-lg);grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius);padding:var(--space-lg);text-align:left;font:inherit;color:inherit;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.card strong{display:block;font-size:var(--font-scale-card);margin-bottom:4px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius);padding:var(--space-lg);margin-top:var(--space-md)}
fieldset{border:0;padding:0;margin:0}legend{font-weight:600;padding:0;margin-bottom:var(--space-xs)}
.opt{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-sm) var(--space-md);border:1px solid var(--line);border-radius:var(--space-radius-sm);margin-top:8px;cursor:pointer}
.opt input{margin-top:5px}
.w-date-format-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:42rem;margin-top:8px}
.w-date-format-options .opt{align-items:center;margin:0}
.single-form .w-date-format-options input[type=radio]{flex:none;width:16px;height:16px;min-height:0;margin:0;padding:0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:var(--space-xs) var(--space-lg);margin:0}dt{color:var(--muted)}dd{margin:0}
input[type=number],input[type=date]{font:inherit;padding:var(--space-xs) 8px;border:1px solid var(--line);border-radius:var(--space-radius-sm);background:var(--bg);color:var(--ink)}
input[type=number]{width:120px}
.inline{display:flex;gap:var(--space-md);flex-wrap:wrap;align-items:center;margin-top:var(--space-xs)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--space-radius-sm);padding:var(--space-sm) var(--space-lg);font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:none;color:var(--accent);border:1px solid var(--line);font-weight:500}
a.btn{text-decoration:none;display:inline-block}
.actions{display:flex;gap:var(--space-sm);margin-top:var(--space-lg);flex-wrap:wrap;align-items:center}
.headline{font-size:var(--font-size-headline);font-weight:var(--font-weight-headline);margin:0}
.kpis{display:grid;gap:var(--space-md);grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:var(--space-md)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius);padding:var(--space-md)}
.kpi b{display:block;font-size:var(--font-size-kpi)}.kpi span{color:var(--muted);font-size:var(--font-size-small)}
[role=tablist]{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:var(--space-xl)}
[role=tab]{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;padding:8px var(--space-md);cursor:pointer}
[role=tab][aria-selected=true]{color:var(--ink);background:var(--accent-soft);font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px var(--space-sm);border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--bad)}.under{color:var(--good)}
.chart{width:100%;height:auto;margin-top:var(--space-md)}.chart text{font-size:var(--font-size-chart)}
:is(.chart,.g-chart,.dt-plot,.g-stability-plot,.fc-chart) text{fill:var(--chart-text)}
.notice{border:1px solid var(--line);border-radius:6px;padding:8px var(--space-md);background:color-mix(in srgb,var(--bad) 8%,var(--surface));margin-top:var(--space-md)}
.notice b{display:block}
.notice.info{background:var(--surface)}
.g-home-wrap .notice{border:0;border-left:4px solid var(--bad);border-radius:0;background:var(--surface)}
.g-home-wrap .notice.info{border-left-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:var(--space-radius);padding:22px;text-align:center;background:var(--surface)}
.drop.over-drop{border-color:var(--accent)}
.scroll{overflow-x:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:var(--space-drawer);max-width:100%;background:var(--surface);border-left:1px solid var(--line);padding:var(--space-lg);overflow-y:auto;transform:translateX(100%);transition:transform .15s;z-index:100}
#drawer[data-open=true]{transform:none}
#drawer h2{margin-top:0}
.bars{display:grid;gap:4px;margin-top:8px}
.barrow{display:grid;grid-template-columns:minmax(80px,min(30%,180px)) minmax(0,1fr) max-content;gap:8px;align-items:center;font-variant-numeric:tabular-nums;color:var(--chart-text)}
.barrow>span:first-child{overflow-wrap:anywhere}
.barrow i{display:block;height:14px;background:var(--bar);border-radius:3px}
.g-signed-plot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:10px;color:var(--chart-text)}
.g-signed-row{display:grid;gap:3px}
.g-signed-label{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.g-signed-label>strong{font-size:var(--font-scale-helper)}
.g-signed-label>span:last-child{font-variant-numeric:tabular-nums}
.g-signed-track{position:relative;background:var(--slate-100);outline:1px solid var(--slate-300);border-radius:5px}
.g-signed-track::after{content:"";position:absolute;inset:0 auto 0 50%;border-inline-start:1px solid var(--slate-400)}
.g-signed-track i{position:absolute;top:50%;transform:translateY(-50%);background:var(--accent);border-radius:2px}
.g-signed-track i.is-zero{min-width:3px;transform:translate(-50%,-50%);background:var(--slate-700)}
.g-signed-track i.is-unconfirmed{background:var(--bar)}
.g-signed-axis{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;border-top:1px solid var(--slate-400);padding-top:4px;font-size:var(--font-scale-micro);font-variant-numeric:tabular-nums}
.g-signed-axis span{position:relative}
.g-signed-axis span::before{content:"";position:absolute;top:-4px;left:0;height:4px;border-inline-start:1px solid var(--slate-400)}
.g-signed-axis span:nth-child(2)::before{left:50%}
.g-signed-axis span:last-child::before{left:auto;right:0}
.g-signed-axis span:last-child{text-align:end}
.g-mix-endpoints{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 8px;padding:0;list-style:none;color:var(--chart-text)}
.g-mix-endpoints li{display:grid;min-width:6rem}
.g-mix-endpoints span{font-size:var(--font-scale-helper)}
.g-slide-visual .bars{gap:1px;padding-inline-start:0}
.g-slide-visual .barrow i{background:color-mix(in srgb,var(--teal-600) 55%,var(--surface))}
.g-slide-visual .barrow i,.g-signed-track i{height:20px}
.g-requirement-track,.g-stability-rail,.dt-gap-track,.g-signed-track{height:59px}
/* ---- application shell (sidebar). The classic layout above is kept temporarily for regression and rollback. ---- */
.skip{position:absolute;left:8px;top:-64px;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--space-radius-sm);border:1px solid var(--line);z-index:40}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.shell-classic .side,body.shell-classic .topbar{display:none}
body.shell-sidebar .classic-header{display:none}
body.shell-sidebar .app{display:grid;grid-template-columns:var(--space-sidebar) minmax(0,1fr);min-height:100vh}
.side{background:var(--sidebar);border-right:1px solid var(--line);padding:29px 18px 20px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--space-sidebar);height:auto;overflow-y:auto}
.side .brand{display:flex;gap:10px;align-items:center;font-weight:var(--font-weight-strong);font-size:1.15rem;margin:0 9px 22px}
.brandmark{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block}
.session-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius-sm);padding:10px 12px;margin:0 3px 16px;display:flex;flex-direction:column;gap:2px;font-size:var(--font-size-small)}
.session-box span{color:var(--muted);overflow-wrap:anywhere}
.side-action{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--space-radius-sm);padding:13px 16px;margin:0 3px 18px;font:inherit;font-weight:700;text-align:left;cursor:pointer}
.side-action::before{content:"+";margin-right:10px}
.side-action[aria-current=page]{box-shadow:0 0 0 3px var(--accent-soft)}
.side-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side-item{width:100%;text-align:left;background:none;border:0;border-radius:var(--space-radius-sm);padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.side-item:hover{background:var(--surface)}
.side-item[aria-current=page]{background:var(--surface);font-weight:700}
.side-item:disabled{color:var(--muted);cursor:not-allowed}
.side-item:disabled:hover{background:none}
.side-foot{margin-top:auto;padding:12px 3px 0}
.topbar{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md) 20px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
.topbar .crumb{color:var(--muted);flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--space-radius-pill);padding:4px 12px;font-size:var(--font-size-small);overflow-wrap:anywhere}
#menu-toggle{display:none}
.steps{list-style:none;margin:var(--space-xs) 0 0;padding:0;display:grid;gap:4px}
.steps .done{color:var(--good)}.steps .todo{color:var(--muted)}
@media (max-width:1200px){body.shell-sidebar .app{grid-template-columns:calc(var(--space-sidebar) - 28px) minmax(0,1fr)}}
@media (max-width:840px){
  body.shell-sidebar .app{display:block}
  .side{position:fixed;top:0;bottom:0;left:0;height:auto;width:min(var(--space-sidebar),86vw);transform:translateX(-100%);visibility:hidden;transition:transform .15s,visibility 0s linear .15s;z-index:25}
  body.menu-open .side{transform:none;visibility:visible;transition:transform .15s,visibility 0s}
  #menu-toggle{display:inline-block}
}
@media (max-width:490px){.rev td.nw{white-space:normal}main{padding:20px 14px 48px}.topbar{padding:10px 14px}.chip{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;scroll-behavior:auto!important}}

.wiz{max-width:780px}
.stepper{list-style:none;display:flex;gap:var(--space-xs);padding:0;margin:var(--space-md) 0 var(--space-lg);flex-wrap:wrap}
.stepper button{background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius-pill);padding:6px 14px;font:inherit;color:var(--ink);cursor:pointer}
.stepper button[aria-current=step]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stepper button:disabled{cursor:not-allowed;color:var(--muted)}
fieldset{border:0;padding:0;margin:0 0 var(--space-md);min-width:0}
fieldset.vers{border:1px solid var(--line);border-radius:var(--space-radius-sm);padding:var(--space-md);background:var(--surface)}
legend{font-weight:700;padding:0;margin-bottom:2px}
.field{margin:0 0 var(--space-md)}
label.f{display:block;font-weight:700;margin-bottom:2px}
.hint{color:var(--muted);font-size:var(--font-size-small);margin:0 0 6px}
.wiz input[type=text],.wiz input[type=number],.wiz input[type=date],.wiz input[type=datetime-local]{width:100%;max-width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:var(--space-radius-sm);background:var(--surface);color:var(--ink);font:inherit}
.wiz input[aria-invalid=true]{border-color:var(--bad)}
.werr{color:var(--bad);margin-top:4px;font-weight:600}
.good{color:var(--good)}.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--space-radius-pill);padding:3px 10px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.addrow{display:flex;gap:var(--space-sm);align-items:center}.addrow input{flex:1}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-lg);align-items:start}
.wiz-review{grid-template-columns:minmax(0,1fr)}
@media (min-width:1500px){.wiz{max-width:1100px}.wiz-review{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.wiz-review .rev{margin-bottom:var(--space-lg)}
.setby{background:var(--accent-soft);border-radius:var(--space-radius-sm);padding:10px 12px;margin:0 0 var(--space-md)}
.rev h3{margin:0 0 6px}.wiz-side h3{margin:var(--space-md) 0 6px}.wiz-side h3:first-child{margin-top:0}
.adv{margin-top:var(--space-md)}.adv summary{cursor:pointer;color:var(--accent);font-weight:700}
.wiz [id]{scroll-margin-top:84px}
@media (max-width:840px){.cols2,.wiz-review{grid-template-columns:minmax(0,1fr)}}
.wiz dd,.wiz li,.wiz .muted{overflow-wrap:anywhere}
.tzcomb{position:relative}
.tzrow{display:flex;gap:var(--space-sm);align-items:stretch}
.tzrow input{flex:1}
.tzopen{white-space:nowrap}
.tzpop{position:absolute;top:100%;left:0;right:0;z-index:30;margin:4px 0 0;padding:0;list-style:none;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--space-radius-sm);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 15%,transparent)}
.tzpop[hidden]{display:none}
.tzpop li{padding:9px 12px;cursor:pointer;overflow-wrap:anywhere}
.tzpop li:hover,.tzpop li.sel{background:var(--accent-soft)}
.tzpop li.sel{outline:3px solid var(--accent);outline-offset:-3px}
.tzpop .tzh{font-weight:600}
.tzpop .tzid{margin-left:8px;color:var(--muted);font-size:var(--font-size-small)}
.tzpop .tz-none{padding:9px 12px;color:var(--muted);cursor:default}

.sr{position:absolute;left:-9999px}
ul.plain{margin:var(--space-xs) 0 0;padding-left:20px}
.panel>strong{display:block;margin-bottom:var(--space-sm)}
.nw{white-space:nowrap}

.dt-gap-arrow{--head:15px;--shoulder:5px;position:absolute;top:50%;left:0;width:100%;height:39px;transform:translateY(-50%) scaleX(var(--arrow-direction));background:var(--arrow-color);pointer-events:none;
 clip-path:polygon(0 var(--shoulder),calc(100% - var(--head)) var(--shoulder),calc(100% - var(--head)) 0,100% 50%,calc(100% - var(--head)) 100%,calc(100% - var(--head)) calc(100% - var(--shoulder)),0 calc(100% - var(--shoulder)))}

:is(.dt-comparison-frame,.dt-guide) [data-performance="neutral"]{--performance-color:var(--slate-600)}
@container (width < 15px){.dt-gap-segment>.dt-gap-arrow{display:none}.dt-gap-endpoint{display:block}}

.g-chapter-toggle[aria-expanded=true] span{transform:rotate(90deg)}

/* Workspace and Cockpit task surfaces. The report keeps its own palette. */
body.shell-sidebar.athena-task-page main{background:var(--task-canvas)}
:root[data-theme=dark] .athena-task-page{color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .athena-task-page{color-scheme:dark}}
.g-workspace-wrap,.g-home-wrap:has(>#cockpit-form){max-width:1180px;padding-top:var(--space-lg)}
.athena-task-page :is(.workspace-setup,.g-grain-card,.optional-grid,.cockpit-section,.cockpit-actionbar,.g-dataset-modal,.g-loaded-modal){background:var(--task-surface);border-color:var(--task-divider)}
.athena-task-page :is(.workspace-setup,.g-grain-card,.optional-grid,.cockpit-section){box-shadow:var(--space-shadow)}
.athena-task-page .workspace-setup-core{grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));align-items:start}
.workspace-setup-detail summary,.cockpit-dataset-disclosure summary{cursor:pointer;color:var(--aegean-700);font-size:var(--font-scale-helper)}
#side .g-nav-btn[aria-current=page],#side #g-insights-nav .g-nav-btn[aria-current=location]{background:var(--insights-header);color:var(--slate-900)}

.workspace-profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}

.workspace-setup .workspace-setup-core>dl,.workspace-profile-grid dl{padding-inline-start:9px;border-inline-start:2px solid var(--line)}
.workspace-profile-grid dl{margin:0 0 8px;overflow-wrap:anywhere}
.workspace-profile-grid dl:not(:last-child){margin-block-end:12px}
.workspace-profile-grid dt{font-size:var(--font-scale-helper);color:var(--muted)}
.workspace-profile-grid dd{margin:2px 0 0}
.cockpit-dataset-disclosure{border-top:1px solid var(--slate-200);padding-top:12px;margin-top:12px}
.cockpit-loaded-files{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0 0}
.cockpit-loaded-files li{min-width:0;max-width:100%;overflow-wrap:anywhere;padding:4px 10px;border-radius:var(--space-radius-pill);background:var(--slate-50);border:1px solid var(--slate-200)}
.cockpit-loaded-files li.is-primary{background:color-mix(in srgb,var(--slate-50) 83%,#000);color:var(--slate-900);font-weight:600}
[data-theme=dark] .cockpit-loaded-files li{background:var(--slate-100)}
[data-theme=dark] .cockpit-loaded-files li.is-primary{background:color-mix(in srgb,var(--slate-50) 75%,#000)}
.workspace-setup .workspace-profile-grid,.cockpit-scoring-fields{min-width:0}
.cockpit-scoring-fields{grid-column:1/-1}.cockpit-scoring-fields .field{display:flex;flex-direction:column;justify-content:space-between}.cockpit-unit>span{flex-shrink:0}
[role=radio] .selection-check{border-radius:50%}
[role=radio][aria-checked=true] .selection-check::after{content:"";width:7px;height:7px;border:0;border-radius:50%;background:currentColor;transform:none}
.cockpit-adoption{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.cockpit-adoption h3{margin:0 0 8px}
@media(max-width:900px){.workspace-profile-grid{grid-template-columns:minmax(0,1fr)}}
.athena-task-page .optional-grid{display:block;border:1px solid var(--task-divider);border-radius:var(--space-card-radius);container-type:inline-size}
.optional-row-heading,.athena-task-page .optional-card{display:grid;grid-template-columns:minmax(145px,1fr) minmax(145px,1.15fr) minmax(75px,.45fr) minmax(180px,1fr);gap:12px;align-items:start;padding:10px 14px}
.optional-row-heading{font-size:var(--font-scale-helper);font-weight:600;color:var(--muted);background:var(--slate-50);border-radius:var(--space-card-radius) var(--space-card-radius) 0 0}
.athena-task-page .optional-card{border:0;border-top:1px solid var(--task-divider);border-radius:0;background:transparent;box-shadow:none}
.athena-task-page .optional-card-header{justify-content:flex-start;align-items:flex-start;min-width:0}
.athena-task-page .optional-card .dataset-card-footer{margin:0;padding:0}
.optional-file-meta{min-width:0;overflow-wrap:anywhere}.optional-file-meta .notice{margin-top:4px}
@container(max-width:640px){.optional-row-heading{display:none}.athena-task-page .optional-card{grid-template-columns:1fr;gap:4px}.athena-task-page .optional-card .dataset-card-footer{justify-content:flex-start}}
.athena-task-page .cockpit-surface{background:transparent;border:0;border-radius:0;padding:0 0 14px;display:grid;gap:var(--space-md)}

.athena-task-page .cockpit-jumps button[aria-current=true]{background:var(--selection-surface);border-color:var(--selection-border)}
.athena-task-page .cockpit-section{border:1px solid var(--task-divider);border-radius:var(--space-card-radius);padding:var(--space-md)}
.g-settings-workflow{width:1020px;max-width:var(--settings-max-width,calc(100vw - 36px));height:auto;max-height:var(--settings-max-height,min(850px,calc(100dvh - 36px)));background:var(--settings-surface);border-color:var(--settings-divider)}
.g-settings-workflow.g-file-modal{width:625px}
.g-settings-workflow .g-modal-sidebar{width:210px;flex:none;padding:14px 10px;background:var(--settings-rail);border-color:var(--settings-divider)}

.g-settings-workflow .g-modal-tab-btn{color:var(--ink);font-size:var(--font-scale-helper)}
.g-settings-workflow .g-modal-tab-btn.g-active{background:var(--settings-selection);color:var(--settings-selection-ink);font-weight:700}
.g-settings-workflow .g-settings-action-note{color:var(--slate-600)}

.g-settings-workflow .g-modal-header-bar{padding:11px 15px;border-color:var(--settings-divider)}
.g-settings-workflow .g-modal-scroll-pane{padding:14px 15px;min-height:0;background:var(--settings-canvas)}
.g-settings-workflow .g-modal-scroll-pane :is(.panel,.profile-section,.g-sample-note){background:var(--settings-surface);border:1px solid var(--settings-divider);border-radius:8px;box-shadow:var(--space-shadow)}
.g-settings-workflow .g-modal-scroll-pane .g-current-setup{container-type:inline-size;padding:16px 20px}
.g-current-setup h2{margin:0;font-size:var(--font-scale-card);font-weight:700}
.g-current-setup .workspace-setup-heading{gap:12px 16px}
.g-current-setup .workspace-setup-core{grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));align-items:start;gap:12px 20px;margin:0}
.g-current-setup .workspace-setup-core dl{display:block;margin:0;min-width:0}
.g-current-setup dt{font-size:var(--font-scale-helper);margin:0 0 3px}
.g-current-setup dd{font-size:var(--font-scale-body);margin:0;overflow-wrap:anywhere}
.g-current-setup .g-current-profile{margin-top:12px;padding-top:12px;border-top:1px solid var(--task-divider)}
.g-current-profile summary{width:fit-content;max-width:100%;padding:3px 0;border-radius:3px;cursor:pointer;color:var(--aegean-700);font-size:var(--font-scale-helper);font-weight:650}
.g-current-profile summary:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.g-current-profile .workspace-setup-core,.g-current-setup .g-current-setup-note{margin:10px 0 0}
@container (330px <= width < 680px){
  .g-current-setup>.workspace-setup-core:has(>dl:nth-child(4)){grid-template-columns:repeat(2,minmax(0,1fr))}
}
.g-settings-workflow .profile-section{margin:0 0 12px;padding:12px}
.g-settings-workflow :is(.profile-jumpbar,.profile-actions){background:var(--settings-surface);border-color:var(--settings-divider);padding:8px 15px}
.g-settings-workflow .field :is(input:not(:where([type=checkbox],[type=radio])),select,textarea){background:var(--settings-surface);border-color:var(--settings-field)}
.g-settings-workflow .field [aria-invalid=true]{border-color:var(--bad)}
.g-settings-templates{display:grid;gap:9px}
.g-settings-template{min-width:0;border:1px solid var(--settings-divider);border-radius:8px;background:var(--settings-surface);box-shadow:var(--space-shadow)}
.g-settings-template>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 18px;align-items:center;gap:10px;padding:10px 12px;border-radius:7px}
.g-settings-template>summary::-webkit-details-marker{display:none}
.g-settings-template>summary:hover,.g-settings-template[open]>summary{background:var(--settings-quiet)}
.g-settings-template>summary:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-3px}
.g-settings-template[open]>summary{border-radius:7px 7px 0 0}
.g-settings-template-badge{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--settings-selection);color:var(--settings-selection-ink);font-size:var(--font-scale-micro);font-weight:700}
.g-settings-template-label>*{display:block}
.g-settings-template-label .muted{font-size:var(--font-scale-helper)}

.g-settings-template[open] .g-settings-template-chevron{transform:rotate(180deg)}
.g-settings-template-body{padding:10px 12px 12px;border-top:1px solid var(--settings-divider)}
.g-settings-template-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:9px}
.g-settings-template-tools>div{flex:1 1 240px;font-size:var(--font-scale-helper)}
.g-settings-template-tools p{margin:0 0 3px}
.g-settings-template-tools .btn{margin-left:auto}
.g-settings-template-table{--field-row:50px;--field-header:34px;border:1px solid var(--task-divider);border-radius:6px;overflow:hidden}
.g-settings-template-table[tabindex]{max-block-size:calc(7 * var(--field-row) + var(--field-header) + 2px);overflow:auto;scrollbar-gutter:stable}
.g-settings-template-table:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.g-settings-template-table table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:var(--font-scale-helper)}
.g-settings-template-table thead{position:sticky;top:0;background:var(--settings-quiet)}
.g-settings-template-table thead tr{height:var(--field-header)}
.g-settings-template-table tbody tr{height:var(--field-row)}
.g-settings-template-table :is(th,td){padding:6px 8px;vertical-align:middle;overflow-wrap:anywhere}
.g-settings-template-table tbody tr:last-child>*{border-bottom:0}
.g-settings-template-table col:nth-child(1){width:25%}
.g-settings-template-table col:nth-child(2){width:13%}
.g-settings-template-table col:nth-child(3){width:40%}
.g-modal-scrim.g-settings-closing::before{animation:g-settings-scrim-close .17s ease-in both}
.g-modal-scrim.g-settings-closing>.g-settings-workflow{animation:g-settings-close .2s ease-in both}
@keyframes g-settings-close{from{opacity:var(--settings-close-opacity,1);transform:var(--settings-close-transform,none)}to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes g-settings-scrim-close{from{opacity:var(--settings-scrim-opacity,1)}to{opacity:0}}
@media (max-width:995px){
  .g-settings-workflow{flex-direction:column}
  .g-settings-workflow .g-modal-sidebar{width:100%;border-right:0;border-bottom:1px solid var(--settings-divider);padding:5px 9px}
  .g-settings-workflow .g-modal-sidebar>div{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .g-settings-workflow .g-modal-sidebar h2,.g-settings-workflow .g-modal-tab-btn{width:auto;margin:0}
  .g-settings-report-action{margin:0;padding:0;border:0}
